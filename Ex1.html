<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 10px;
        }
        .container div{
            background-color: aqua;
            padding: 15%;
            text-align: center;
            color: rgb(28, 22, 28);
        }

        @media (max-width:1000px){
        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }
        }

         @media (max-width:768px){
        .container{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 10px;
        }
        }

         @media (max-width:480px){
        .container{
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        }

    </style>
</head>
<body>
    <div class="container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
        <div>Item 7</div>
        <div>Item 8</div>
    </div>
</body>
</html>

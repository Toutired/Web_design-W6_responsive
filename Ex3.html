<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise3</title>
    <style>
        .container{
            display: grid;
            grid-template-rows: 1fr 0.9fr 0.9fr 1fr;
            gap: 5px;
        }

        .Head{
            background-color: black;
            color: aliceblue;
            text-align: center;
            padding:2%
        }
        .Main{
            background-color: rgb(184, 187, 180);
            padding: 1%;
            margin: 0 1%;
        }
        .Side{
            background-color: grey;
            padding: 1%;
            margin: 0 1%;
        }

        @media (min-width:600px) and (max-width:900px){
           .container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
        }

        .Head{
            background-color: black;
            color: aliceblue;
            text-align: center;
            padding:2%;
            grid-column: 1/3;
        }
        .Main{
            background-color: rgb(184, 187, 180);
            padding: 1%;
            margin: 0 3%;
        }
        .Side{
            background-color: grey;
            padding: 1%;
            margin: 0 3%;
        } 
        }

        @media (min-width:900px){
           .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
        }

        .Head{
            background-color: black;
            color: aliceblue;
            text-align: center;
            padding:2%;
            grid-column: 1/5;
        }
        .Main{
            background-color: rgb(184, 187, 180);
            padding: 1%;
            margin: 0 1%;
            grid-column: 1/4;
        }
        .Side{
            background-color: grey;
            padding: 1%;
            margin: 0 1%;
            grid-column: 4/5;
        } 
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="Head">Reponsive Header</div>
        <div class="Main">Main content</div>
        <div class="Side">Sidebar</div>
        <div class="Head">Footer</div>
    </div>
    
</body>
</html>

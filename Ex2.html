<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise2</title>
    <style>
        .Container{
            display: flex;
            flex-direction: row;
            color: aliceblue;
            background-color: black;
            gap: 3%;
        }
        .Logo{
            margin-right: 60%;
        }

        .sign{
            display: none;
        }

        @media (max-width:768px){
            .sign{
                display: block;
                margin-left: 20%;
            }
            .box{
                display: none;
            }
        }
        
    </style>
</head>
<body>
    <div class="Container">
        <div class="Logo">
            Logo
        </div>

        <div class="box">Home</div>
        <div class="box">About</div>
        <div class="box">Services</div>
        <div class="box">Contact</div>
        <label for="menu-toggle" class="sign">&#9776;</label>

    </div>
</body>
</html>
